[package]
name = "auditable-voting-worker"
version = "0.1.53"
edition = "2021"
description = "Delegated Nostr worker for auditable-voting elections"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
auditable-voting-blind-credentials = { path = "../blind-credential-core" }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
nostr-sdk = "0.45.6"
nostr = { version = "0.45.7", features = ["nip59"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
blind-rsa-signatures = { version = "=0.18.0", path = "../vendor/blind-rsa-signatures" }
nostr-sdk = { version = "0.45.6", features = ["local-relay"] }
