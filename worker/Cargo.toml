[package]
name = "auditable-voting-worker"
version = "0.1.31"
edition = "2021"
description = "Delegated Nostr worker for auditable-voting elections"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
blind-rsa-signatures = "0.17.1"
chrono = { version = "0.4", features = ["serde"] }
crypto-bigint = "0.7.3"
flate2 = "1.0"
nostr-sdk = { version = "0.44.1", features = ["nip59"] }
rand = "0.9"
rsa = "0.10.0-rc.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
