# Email dependency smoke — cashu.email real-send verification + offline logic tests
#
# Q1/Q3: prove the cashu.email email dependency works, WITHOUT burning 100 sats
# or tripping Cloudflare on every PR commit.
#
# Design (respects rate-limit + cost constraints):
#   - offline-test: deterministic stub-based send-logic regression net. 0 cost,
#     0 network, no Cloudflare exposure. Runs on EVERY PR/commit.
#   - live-send: ONE real cashu.email send, only on a schedule (~daily) and on
#     manual dispatch — NOT on push-to-main and NOT per PR commit. Bounded spend
#     + no Cloudflare hammering. This is the "one test per CI run to confirm the
#     dependency actually works" that catches "it's not working" complaints.
#
# ZERO SECRETS: the live send is fully self-contained. It generates a fresh
# ephemeral Nostr key at run time, mints fresh testnut ecash via the Nutshell
# CLI (JSON V4 cashuB — the format cashu.email accepts), and self-sends to the
# derived npub@cashu.email. cashu.email treats the npub as the address with no
# pre-registration, so a brand-new key works immediately. No NOMAIN_NSEC /
# TESTNUT_MINT_CASHU_TOKEN / TEST_RECIPIENT secrets are required, and the job
# is fork-safe (nothing to leak).

name: Email Smoke (cashu.email)

on:
  pull_request:
  schedule:
    - cron: "37 4 * * *"   # daily 04:37 UTC — 1 send/day max from live-send
  workflow_dispatch:        # manual on-demand probe (e.g. before onboarding)

concurrency:
  group: email-smoke
  cancel-in-progress: false   # never cancel a smoke that's already spending postage

jobs:
  offline-test:
    name: Email send logic (offline, deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies (for nostr-tools)
        run: npm ci
        working-directory: web

      # Always-on regression net: stubs the nomail/cashu.email HTTP layer.
      # Runs on EVERY PR/commit. Q3: cashu.email send-logic coverage in CI.
      - name: Run offline email send tests
        working-directory: .
        run: node --test scripts/test/otp-send-email.test.mjs scripts/test/email-sender.test.mjs

  live-send:
    name: Real cashu.email send (self-contained, zero secrets)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies (for nostr-tools)
        run: npm ci
        working-directory: web

      - name: Install Nutshell CLI (produces JSON V4 cashuB tokens)
        run: pip install --user cashu

      # Exactly ONE real send. No retry loop. 200 {ok:true} or the job fails
      # loudly (the "dependency is broken" signal the operator wants).
      - name: Run self-contained live email smoke (fresh key + fresh mint + self-send)
        run: |
          node scripts/test/live-otp-send-email.selfcontained.mjs
