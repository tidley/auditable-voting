<!DOCTYPE html>
<html lang="en">
  <head>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("av-theme");
        // Light is the instance default. Only an explicit choice made with the
        // sun/moon toggle is honoured; the OS colour-scheme preference is
        // deliberately ignored.
        document.documentElement.dataset.theme =
          stored === "light" || stored === "dark" ? stored : "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FCFAF2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070d10" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%images/auroville-symbol.svg" />
    <link rel="alternate icon" type="image/png" href="%BASE_URL%images/auroville-symbol.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%images/auroville-symbol.png" />
    <title>Auditable Voting Voter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/vote.tsx"></script>
  </body>
</html>
