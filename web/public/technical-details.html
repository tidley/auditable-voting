    <script id="source" type="text/plain"># Technical protocol note

This is the detailed protocol and implementation note for Auditable Voting. For a shorter non-technical overview, start with [How auditable voting works](./project-explainer.html).

Auditable Voting is a client-side voting app on public relay infrastructure for private credential issuance, anonymous response submission, and independent auditing.

The current repository contains only the browser app. It has voter, organiser, and observer roles; private traffic uses NIP-17 DMs; public state is replayed from public relay events.

## Quick Start: Run an Auditable Vote in the Browser

This is the practical browser-based flow. The root landing page defaults to **Observer** for public verification; choose **Organiser** when setting up a questionnaire, then use a separate browser profile, private window, or second device for the voter so each role has its own local identity.

### 1. Organiser builds the questionnaire

1. Open the app as **Organiser**.
2. Create or load an organiser identity.
3. In **Setup**, enter the questionnaire name, description, and questions. Supported question types are yes/no, multiple choice, ranked-choice, and free text; free-text questions can also require organiser-encrypted responses. Ranked-choice answers are totalled as points, with the highest score preferred: first choice gets one point per available option, later choices count down from there, and unranked options get `0` points.
4. Use **Generate ID** only when you want a fresh questionnaire ID. Use **Copy ID** beside the Questionnaire ID when sharing the public identifier with observers.
5. Use **Show questionnaire link** if you want a QR/link for the questionnaire.
6. Optionally open **Settings → Relays** to add or remove questionnaire metadata relays before publishing if this round should prefer a non-default relay set.
7. Click **Go Live** when the draft is ready. This publishes the questionnaire definition and opens the round.

### 2. Optional: organiser enables an audit proxy

1. After publishing, click **Set up audit proxy** if this questionnaire should keep processing while the organiser browser is offline.
2. The audit proxy section opens and generates a proxy account.
3. Copy the **Quick start command** and run it on the machine that should host the proxy.
4. Configuration is confirmed automatically when a fresh proxy heartbeat appears. The organiser sends the active delegation and complete questionnaire configuration privately to that proxy; the proxy does not discover configuration from public relay history.
5. Wait for **Audit proxy status** to show the active proxy before relying on it for issuance or verification.

### 3. Organiser invites voters

1. Share the questionnaire link from **Voting** with **Copy link** or **Share**. These actions use the browser/device apps already available; no provider API key or service registration is needed.
2. Use **Create single-use invite link** in **Voters** when the organiser wants a one-use bearer invite. New links carry the private code only in the URL fragment as `#invite_code=...`; the questionnaire, organiser, relay, ballot-request, credential, and group parameters remain in the query. On entry, the browser accepts either fragment aliases or previously issued query-string aliases, then immediately scrubs `invite_code` and `code` from both locations and retains the normalised code only in the current history entry, not local storage or backups. Each invite appears in **Participants** with an internal note, voter status, vote/result status for the selected questionnaire, QR code, and actions. **Mark as used** records manual use and makes an unclaimed link unavailable; clearing it makes the unclaimed link available again. Voter status shows whether the link has been claimed, a ballot has been sent, a vote has been submitted, or the organiser has manually marked it as used. The voter looks up organiser and audit-proxy routing from the public questionnaire metadata on Nostr, then automatically requests a ballot.
3. Add or import voter `npub`s in **Voters** when you want to invite voters once and reuse that eligibility for later questionnaires from the same organiser. Each invited voter can have an internal note, and remains eligible for later questionnaires until removed. Click **Apply to current questionnaire** to project the roster into the active questionnaire whitelist and publish one roster-free public questionnaire announcement. After one questionnaire is published, **Add session** appears under **Questionnaire**, creates a fresh questionnaire ID from the current setup, and offers only **Publish to invited voters**, which publishes and projects the roster in one flow. The roster is organiser-local; it is not published and is not a reusable ballot credential.
4. Use **Copy personalised link** beside an invited/whitelisted voter when the link should carry that invited voter `npub`. The voter must still sign in as that `npub`; the personalised URL reveals the invitee `npub` to whoever sees the link.
5. Send Nostr invite DMs with **Invite** beside each Nostr invite voter. Voters who claimed a private link stay in the private invite cards and are not repeated in the Nostr invite action list.
6. Voters who arrive from a shared link without being whitelisted can still request a ballot. Pending requests appear in **Voters** -&gt; **Participants** on **Voting**, where the organiser can approve and invite them.

### 4. Voter requests and submits

1. Open the invite link as the invited voter, or open the app as **Voter** and click **Check invites**.
2. Open the pending questionnaire.
3. Click **Request ballot** if the blind credential request does not start automatically. Current questionnaires request one scoped credential for the response group; large request bundles may be compressed before NIP-17 encryption, with plain JSON kept as the fallback.
4. Wait for the ballot credential to be ready.
5. Complete the questionnaire and click **Submit**.
6. After submission, Vote keeps the submitted answers visible and locks the question controls for that questionnaire.
7. When several questionnaires from the organiser are available, Vote labels the selector by round and local status, and **Answer next** opens the next unanswered questionnaire.
8. **Messages** is limited to the organiser target for the active public questionnaire link. With one organiser it opens directly to the thread; Enter sends and Shift+Enter inserts a line break.
9. If no proxy is selected, the organiser browser must stay online long enough to process requests and responses. If a proxy is selected and active, the voter can wait for the proxy instead.

### 5. Organiser or proxy processes responses

1. In the organiser **Voting** tab, **Live Status** and the results dashboard show live accepted-response totals, per-question result bars, and text responses as submissions are processed. **Voters** -&gt; **Participants** shows private invite rows, pending voter requests, and received vote/result details for the selected questionnaire.
2. If delegated, leave the helper running and check its heartbeat/reporting in **Audit proxy status**. The organiser results view backfills proxy-accepted public responses and decisions from relay data, so the organiser can inspect the same accepted set the observer sees after the proxy has processed submissions.
3. Close the questionnaire and publish final results when collection is complete, if you want a fixed final summary.

### 6. Observer verifies

1. Open the app as **Observer**.
2. Search by organiser `npub` or questionnaire ID.
3. Confirm submitted votes, accepted responses, expected participant count, and result percentages from the public events.
4. The observer can show current accepted responses before closure when public response and decision events are available.
5. If encrypted answer details need to be inspected, enter the matching organiser `nsec` in **Decrypt answer details**. Decryption happens locally in the browser.

## Current Flow

### Organiser

1. Build and publish a questionnaire definition (public event), including non-default relay hints when configured.
2. Share the public questionnaire link by copy or native device sharing, optionally using personalised links or roster-applied public announcements for invited voter npubs.
3. Optional: in the separate **Questionnaire** tab `Audit proxy` section, use Set up audit proxy after publication to open the simplified proxy page, generate a fresh audit proxy account, copy the quick start command, and let the page confirm configuration automatically when the proxy heartbeat appears. Delegation still leaves the organiser as root authority.
4. Receive blind-token requests over private DMs (or delegate handling to an audit proxy).
5. Issue blind signatures to authorised voters over private DMs (or let the audit proxy blind-sign on behalf of the organiser for that delegated round). Invite payloads and cached election metadata carry the audit proxy routing hint plus a questionnaire pointer, so voters can keep targeting the audit proxy if the organiser browser goes offline; audit proxy election-config DMs carry the public definition pointer, and credential DMs carry only credentials/signatures plus a definition hash or event id.
6. Watch public submissions and publish public accept/reject decisions (or delegate decision publication).
7. Close the round and publish the result summary (or delegate proxy close + auto-summary once all expected invitees have accepted valid responses). Final summaries may reference a two-mirror Blossom result pack for large response detail readback.

If the Questionnaire tab reports that the blind-signing key is still initialising, wait a moment and try publishing again; the app now attempts to recover the locally persisted blind-signing key before blocking publication.

### Audit Proxy

The audit proxy is an optional Rust helper for keeping delegated questionnaire work running when the organiser browser is not open. It does not become the root authority for the questionnaire: the organiser still creates the questionnaire, owns the organiser identity, signs the delegation, and can revoke or replace the proxy.

For larger live sessions, such as dozens of rounds or around 100 voters, the audit proxy is the recommended default for blind issuance, submission verification, public decision publication, and delegated close/summary work. That keeps the organiser browser as root authority while moving the high-volume request processing into a dedicated worker.

The proxy receives two private control messages from the organiser:

1. a signed worker delegation that names the questionnaire, proxy `npub`, capabilities, control relays, and expiry
2. an election config message containing the public questionnaire definition pointer, blind-signing material needed for delegated issuance, per-questionnaire whitelisted voter npubs projected from the organiser's invited-voter roster, private invite-code hashes, and the routing hints voters should use

After activation, the proxy subscribes to its own NIP-17 mailbox over outbound relay connections, with bounded polling as a recovery path. It can issue blind ballot credentials, including first-claim private code invites, publish submission decisions, verify public submissions, close the questionnaire once the accepted valid response count reaches the expected invitee count, and publish result summaries when those capabilities are delegated. When it publishes delegated summaries, it can mirror a CSV result pack to Blossom and attach the URLs, size, and SHA-256 only after two uploads succeed. It refuses blind-signing material that does not match the published questionnaire definition, decodes compressed request bundles before normal parsing, sends heartbeats and operation reports back to the organiser so the Questionnaire tab can show whether the proxy is active, and stays running for later delegated questionnaires until it is closed from the command line.

Proxy closure is guarded by the same accepted-response set used for summary publication. Rejected, duplicate, invalid, or spam submissions do not count towards automatic closure. The delegated close event is published as questionnaire state with proxy provenance, so Organiser and Observer views label it as `Closed by audit proxy`.

For voters, the important distinction is who is expected to answer the blind request:

- without a proxy, `Waiting for organiser` means the organiser browser must come online and process the request
- with a proxy, `Waiting for audit proxy` means the delegated helper should issue the credential, even if the organiser browser has gone offline

Invite payloads and cached questionnaire metadata include the proxy routing hint, and signed public delegations include the proxy's private-DM relay set. Voters keep targeting the proxy after reloads and prefer the questionnaire relay hints for the round's public events. Private NIP-17 worker DMs default to vm-1734.lnvps.cloud, relay.nostr.net, and nos.lol. Delegated blind requests go only to the issuer proxy; blind request, issuance, and recovery traffic uses the configured private-DM relays directly and does not use NIP-65 discovery. Authenticated voter and proxy status messages keep the organiser informed, and receipt acknowledgements return to the proxy. Browser DM reads skip relays that require unsupported recipient authentication, and foreground browser recovery caps private-DM reads to avoid exhausting browser WebSocket resources. Older persisted relay hints are retained but retried with per-relay exponential backoff.

### Voter

1. Open an invite or log in as **Voter**.
2. Open the questionnaire.
3. Request a blind ballot credential (auto when invite context exists, or use `Request ballot`).
4. Wait for the ballot credential to be ready.
5. Fill in the response fields.
6. Submit publicly with an ephemeral response npub and blind-token proof.
7. Wait for the organiser’s public submission decision.

### Observer

1. Open **Observer**.
2. Read public submissions and public submission decisions.
3. Verify accepted/rejected outcomes and per-question totals.
4. Compare live accepted responses with the public expected-response count when the organiser has published one.
5. Use **Submitted Votes** for per-response detail (search/filter), and enable `Show invalid votes` when you need rejected-row diagnostics.
6. Use **Decrypt answer details** only when the matching organiser `nsec` has been deliberately supplied for local decryption.

## Privacy Model

The questionnaire path now uses a real blind-signing shape:

1. The organiser has a questionnaire blind-signing key.
2. The voter creates a local token secret and commitment.
3. The voter blinds the token message with RSABSSA.
4. The organiser signs only the blinded message.
5. The voter unblinds the signature locally.
6. The voter submits using a fresh ephemeral response npub.
7. The organiser verifies the unblinded credential and accepts the first spend for the token nullifier.

The submitted response no longer uses the invited voter npub as the ballot identity.

Current questionnaire questions use the pragmatic privacy model: one internal anonymous response group, with one blind credential and one public proof. That is no different from asking one multi-part question, so the shipped browser flow does not need a zero-knowledge circuit.

Stronger privacy versions would need more specialised cryptography:

- hiding individual answers inside a grouped public ballot needs a zero-knowledge proof that the hidden answers are valid;
- encrypted answers with public tally verification need proofs that each ciphertext is a valid answer and that the published tally was computed from the accepted ciphertexts;
- several unlinkable per-question spends from one eligibility credential need anonymous-credential or set-membership proofs.

These are less accessible than the current RSABSSA blind-signature path. They require audited ZK libraries, explicit circuits, proof-size and browser proving-time checks, and review of trusted-setup or transparent-proof assumptions.

```mermaid
sequenceDiagram
  participant V as Submittor identity
  participant E as Ephemeral response key
  participant C as Organiser
  participant A as Observer

  V->>C: Blinded credential request
  C->>V: Blind signature
  V->>V: Unblind credential locally
  E->>C: Submit response + token proof
  C->>C: Verify credential and nullifier
  C->>A: Publish/update summary
```

## What Is Public

- questionnaire definitions
- questionnaire state changes
- public questionnaire submissions
- public organiser submission decisions (accept/reject)
- published result summaries
- observer-discovered public questionnaire metadata
- separate parameterised replaceable expected-participant count events, so observers can see turnout/completion without private invite contents

## What Stays Private Or Local

- voter login keys
- organiser signing keys
- voter token secrets and blinding factors
- unspent credentials
- private response payloads
- local recovery state

## Architecture

```mermaid
flowchart LR
  V[Voter Browser]
  C[Organiser Browser]
  A[Observer Browser]
  N[Nostr Relays]
  L[(Local Browser State)]

  V <--> N
  C <--> N
  A <--> N
  V --> L
  C --> L
```

The client uses:

- React and TypeScript for the browser UI
- `nostr-tools` for Nostr identities, events, relay reads, and relay writes
- NIP-17 gift-wrapped DMs for private request and issuance traffic; large request/issuance bundle envelopes can be gzip+base64url wrapped before encryption, and plain JSON remains valid
- `@cloudflare/blindrsa-ts` for RSABSSA blind signatures
- Rust/Wasm for deterministic replay and protocol validation in the public round path
- an optional Rust audit proxy runtime (`worker/`) for delegated election operations over outbound-only relay connections
- adaptive browser NIP-17 mailbox recovery that pages backwards until the active request, issuance, or anonymous submission acknowledgement is found, or until a short time budget is reached; local-key voter sessions subscribe to request-ack and credential DMs through the same raw nsec decrypt path used by recovery; only the voter's all-credential acknowledgement advances identity-linked organiser state to Ballot received, including for proxy-issued credentials, and no later submission or decision identifier is attached to that participant; foreground browser recovery caps private-DM reads to two NIP-17 relays and mailbox reads/subscriptions to three relays; public submission decisions are recovered through the public questionnaire event backfill
- audit proxy DM polling with event-id dedupe so relay-randomised gift-wrap timestamps do not cause missed delegated blind requests, plus compressed request-bundle decoding, authenticated voter senders, exact issuance replay until voter acknowledgement, privacy-limited participant statuses to the organiser, active delegation control-relay reads, delegated close + auto-summary after all expected invitees have accepted valid responses, continuous operation until command-line shutdown, and private relay defaults of vm-1734.lnvps.cloud, relay.nostr.net, and nos.lol
- an optional FIPS host launcher (`web/public/fips-host/launch-auditable-voting-fips.sh`) that builds the upstream FIPS Rust daemon, enables `fips-overlay-v1` Nostr endpoint adverts, installs the complete Vite static build on the host's `fips0` address, opens the chosen mesh web port through the FIPS firewall, and can install the audit proxy as a disabled systemd service
- browser storage for private active state and recovery

## Blind Issuance

```mermaid
flowchart LR
  M[Token Message]
  B[Blinding]
  R[Blinded Request]
  S[Organiser Blind-Signs]
  U[Unblinding]
  T[Spendable Credential]

  M --> B --> R --> S --> U --> T
```

The organiser signs a blinded token message. The voter finalises the credential locally and spends it through an ephemeral response key.

## Duplicate Spend Rule

```mermaid
flowchart TD
  A[Spend A with Token X]
  B[Spend B with Token X]
  O[Canonical Ordering]
  K[Keep First Valid Spend]
  D[Reject Duplicate]

  A --> O
  B --> O
  O --> K
  O --> D
```

The current rule is first valid spend wins. The questionnaire flow rejects duplicate nullifiers and duplicate accepted spends for the same token commitment.

## Auditability

```mermaid
flowchart LR
  E[Nostr Events]
  V[Validate]
  D[Deduplicate]
  T[Compute Summary]
  R[Independent Result]

  E --> V --> D --> T --> R
```

Observers derive results from public submissions and public organiser decisions.
The published summary includes per-response references as a parity backfill, or a pointer to a Blossom CSV result pack for larger runs. The Observer verifies the advertised blob size and SHA-256 before showing rows from any Blossom mirror. The CSV opens directly in spreadsheet tools and includes response IDs, submittor pubkeys, answers, nullifiers, token commitments, and blind-token signatures/proofs.

Before a final result summary exists, the observer derives a live summary from verified public submissions and separate public per-question provisional response events. Provisional events are muted chart hints only; they contain no blind-token proof and do not count for the audit result. Organisers also publish a separate parameterised replaceable expected-participant count event, letting the observer show accepted responses against the expected participant total while keeping individual invitees private.

The observer view uses one live subscription for the selected questionnaire and tag-filtered, paginated public refresh reads, with a slower questionnaire-list refresh and an explicit Refresh button for immediate reloads. If an older published questionnaire or result payload is missing from the default list, reopen the direct questionnaire link or refresh from a relay set that still indexes that event. Encrypted answer details remain hidden unless a matching organiser `nsec` is entered for local decryption.

## Current Limits

- Public relays can delay, drop, or rate-limit traffic.
- Public questionnaire refresh reads and organiser blind-DM history reads are serialized and scoped to a smaller primary relay subset, but relay-side limits can still affect freshness during busy runs.
- Organiser private keys and blind-signing keys are browser-local.
- The questionnaire path is currently single-organiser.
- Larger multi-organiser live runs are still operationally fragile on public relays.
- Observer detail is near real-time (poll-based), but exact freshness depends on relay propagation and indexing.
- If a response payload is encrypted/private, Observer can show metadata/decision status without a key and can decrypt answer details locally only when the matching organiser `nsec` is entered. Organiser-side results use the organiser key already present locally.

## Short Summary

> Private eligibility, blind credential issuance, ephemeral response submission, public audit.

      }

      const usedHeadingIds = new Set();
      const slugify = (value) => value.toLowerCase().trim().replace(/[^a-z0-9\s-]/g, "").replace(/\s+/g, "-").replace(/-+/g, "-");

      for (const heading of content.querySelectorAll("h2, h3")) {
        const text = heading.textContent?.trim() ?? "";
        if (!text) continue;
        const baseId = slugify(text) || "section";
        let nextId = baseId;
        let dedupe = 2;
        while (usedHeadingIds.has(nextId) || document.getElementById(nextId)) {
          nextId = `${baseId}-${dedupe}`;
          dedupe += 1;
        }
        usedHeadingIds.add(nextId);
        heading.id = nextId;

        const item = document.createElement("li");
        item.className = `toc-level-${heading.tagName.toLowerCase()}`;
        const link = document.createElement("a");
        link.href = `#${nextId}`;
        link.textContent = text;
        item.appendChild(link);
        tocList.appendChild(item);
        tocLinksById.set(nextId, link);
      }

      const setActiveTocLink = (id) => {
        if (!id || !tocLinksById.has(id)) {
          return;
        }
        for (const [linkId, link] of tocLinksById) {
          const active = linkId === id;
          link.classList.toggle("is-active", active);
          if (active) {
            link.setAttribute("aria-current", "location");
          } else {
            link.removeAttribute("aria-current");
          }
        }
      };

      const getHashTargetId = () => decodeURIComponent(window.location.hash.replace(/^#/, ""));
      setActiveTocLink(getHashTargetId() || content.querySelector("h2, h3")?.id);

      tocList.addEventListener("click", (event) => {
        const link = event.target instanceof Element ? event.target.closest("a[href^='#']") : null;
        if (!link) {
          return;
        }
        setActiveTocLink(link.getAttribute("href")?.slice(1) ?? "");
      });

      window.addEventListener("hashchange", () => setActiveTocLink(getHashTargetId()));

      const visibleHeadings = new Map();
      const headingObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          const target = entry.target;
          if (!(target instanceof HTMLElement)) {
            continue;
          }
          if (entry.isIntersecting) {
            visibleHeadings.set(target.id, entry.boundingClientRect.top);
          } else {
            visibleHeadings.delete(target.id);
          }
        }
        if (visibleHeadings.size === 0) {
          return;
        }
        const [activeId] = [...visibleHeadings.entries()].sort((left, right) => left[1] - right[1])[0];
        setActiveTocLink(activeId);
      }, {
        rootMargin: "-12% 0px -70% 0px",
        threshold: [0, 1],
      });

      for (const heading of content.querySelectorAll("h2, h3")) {
        headingObserver.observe(heading);
      }

      for (const block of content.querySelectorAll("pre code.language-mermaid")) {
        const wrapper = document.createElement("button");
        wrapper.type = "button";
        wrapper.className = "mermaid-wrap";
        wrapper.setAttribute("aria-label", "Enlarge diagram");

        const diagram = document.createElement("div");
        diagram.className = "mermaid";
        diagram.textContent = block.textContent;
        wrapper.appendChild(diagram);

        const pre = block.closest("pre");
        pre.replaceWith(wrapper);
      }

      mermaid.initialize({
        startOnLoad: false,
        theme: "base",
        securityLevel: "loose",
        themeVariables: {
          background: "#070d10",
          primaryColor: "#101820",
          primaryTextColor: "#f3f7fa",
          primaryBorderColor: "#3a4c59",
          lineColor: "#3a4c59",
          secondaryColor: "#0c1319",
          tertiaryColor: "#0c1319",
          noteBkgColor: "#0c1319",
          noteTextColor: "#f3f7fa",
          actorBkg: "#101820",
          actorBorder: "#3a4c59",
          actorTextColor: "#f3f7fa",
          signalColor: "#2dd4bf",
          signalTextColor: "#f3f7fa",
          edgeLabelBackground: "#070d10",
          clusterBkg: "#0c1319",
          clusterBorder: "#2a3a46",
        },
      });
      await mermaid.run({ querySelector: ".mermaid" });

      for (const wrapper of content.querySelectorAll(".mermaid-wrap")) {
        wrapper.addEventListener("click", () => {
          modalPanel.innerHTML = wrapper.innerHTML;
          modal.classList.add("is-open");
        });
      }

      const closeModal = () => {
        modal.classList.remove("is-open");
        modalPanel.innerHTML = "";
      };
      modal.addEventListener("click", closeModal);
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeModal();
      });
    </script>
  </body>
</html>
